[project]
name = "ghrah-subject"
version = "0.1.0"
description = "ghrah 控制面/执行层 - 持有工作区、执行沙箱命令、持久化 ActionChain、裁决 HITL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ghrah",
    "ghrah-protocol",
    "aiosqlite>=0.20",
    "agentsconfig",
    "websockets>=12.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
ghrah-subject = "ghrah.subject.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghrah"]

[tool.uv.sources]
ghrah = { workspace = true }
ghrah-protocol = { workspace = true }
agentsconfig = { path = "/home/yuki/gitrepos/agentsconfig/" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.9",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
