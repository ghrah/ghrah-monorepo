[project]
name = "ghrah-protocol"
version = "0.1.0"
description = "Shared protocol types for ghrah"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]
authors = [
  {name = "chenxya", email = "chenxya@ghrah.org"}
]
license = "Apache-2.0"
license-files = ["LICENSES/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghrah"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]