name: github-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的展示 tag（例如 v0.2.0-alpha.0）"
        required: true

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 验证 tag 已存在
        env:
          TAG: ${{ inputs.tag }}
        run: git rev-parse --verify "refs/tags/$TAG"
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes
