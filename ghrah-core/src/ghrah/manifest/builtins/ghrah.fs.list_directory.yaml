manifest: ability
version: "1"
metadata:
  namespace: ghrah.fs
  name: list_directory
  title: List Directory
  description: List files and directories at the specified path. Returns entry names, types, and sizes. Use recursive=true to list all nested contents.
  tags: [filesystem, read]
  permissions:
    fs_read_only: true
tool:
  name: list_directory
  description: List files and directories at the specified path. Returns entry names, types, and sizes. Use recursive=true to list all nested contents. For large directories, set offset/limit to paginate (0-based entry index); the response then carries total_entries/truncated/offset/limit. Without offset/limit the whole listing is returned.
  parameters:
    dir_path:
      type: string
      description: Path to the directory to list
      required: true
    recursive:
      type: boolean
      description: Recursively list nested directories
      required: false
      default: false
    offset:
      type: integer
      description: 0-based entry index to start from (pagination; 0 with limit 0 = legacy full listing)
      required: false
      default: 0
      minimum: 0
    limit:
      type: integer
      description: Max number of entries to return (0 = no limit; pagination active when offset or limit is set)
      required: false
      default: 0
      minimum: 0
implementation:
  type: builtin
  handler: list_directory