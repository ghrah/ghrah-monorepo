manifest: ability
version: "1"
metadata:
  namespace: ghrah.core
  name: session_info
  title: Session Info
  description: Read-only introspection of the runtime environment (deployment mode, allowed roots, HITL parameters), current session, and cluster members.
  tags: [core, introspection]
  permissions: {}
tool:
  name: session_info
  description: Introspect the runtime environment and session — deployment mode, workspace root, allowed filesystem roots, HITL approval parameters, current session, and cluster members. Read-only, no side effects.
  parameters: {}
implementation:
  type: builtin
  handler: session_info