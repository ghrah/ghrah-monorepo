manifest: ability
version: "1"
metadata:
  namespace: ghrah.fs
  name: search_files
  title: Search Files
  description: Search file contents for a regex pattern using ripgrep, with results including file paths and line numbers.
  tags: [filesystem, read, search]
  permissions:
    fs_read_only: true
tool:
  name: search_files
  description: Search file contents for a regex pattern. Returns matching lines with file paths and line numbers. Much more efficient than list_directory + read_file for locating code in large repositories. Use include to filter by file glob (e.g. '*.py').
  parameters:
    pattern:
      type: string
      description: Regular expression to search for
      required: true
    path:
      type: string
      description: Directory or file to search in
      required: true
    include:
      type: string
      description: Optional glob filter for file names (e.g. '*.py')
      required: false
    context_lines:
      type: integer
      description: Lines of context around each match (0-5)
      required: false
      default: 0
    max_results:
      type: integer
      description: Maximum number of matching lines to return (1-200)
      required: false
      default: 50
    ignore_case:
      type: boolean
      description: Case-insensitive search
      required: false
      default: false
implementation:
  type: builtin
  handler: search_files