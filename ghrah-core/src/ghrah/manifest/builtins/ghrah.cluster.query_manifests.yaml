manifest: ability
version: "1"
metadata:
  namespace: ghrah.cluster
  name: query_manifests
  title: Query Manifests
  description: Read-only query of available agent manifests. Without manifest_ref, lists all manifests; with manifest_ref, returns the full definition including its frozen ability list. Use before spawn_agent to pick the right manifest.
  tags: [cluster, discovery]
  permissions: {}
tool:
  name: query_manifests
  description: Read-only query of available agent manifests. Without manifest_ref, lists all manifests; with manifest_ref, returns the full definition including its frozen ability list. Use before spawn_agent to pick the right manifest.
  parameters:
    manifest_ref:
      type: string
      description: Optional full name of a single agent manifest to inspect (e.g. 'ghrah.designer'). Omit to list all available manifests.
      required: false
implementation:
  type: builtin
  handler: query_manifests