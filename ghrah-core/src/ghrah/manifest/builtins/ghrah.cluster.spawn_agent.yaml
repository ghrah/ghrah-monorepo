manifest: ability
version: "1"
metadata:
  namespace: ghrah.cluster
  name: spawn_agent
  title: Spawn Agent
  description: Spawn a new peer agent in the cluster by instantiating an agent manifest.
  tags: [cluster, lifecycle]
  permissions:
    require_hitl: true
tool:
  name: spawn_agent
  description: Spawn a new peer agent in the cluster by instantiating an agent manifest. The new agent's abilities are frozen by the manifest (use query_manifests to inspect available manifests). Optional name/description/system_prompt override the manifest persona.
  parameters:
    manifest_ref:
      type: string
      description: Manifest reference of the agent template to instantiate
      required: true
    name:
      type: string
      description: Optional runtime name override for the new agent (defaults to the manifest-defined name)
      required: false
    description:
      type: string
      description: Optional description override for the new agent
      required: false
    system_prompt:
      type: string
      description: Optional system prompt override for the new agent
      required: false
implementation:
  type: builtin
  handler: spawn_agent