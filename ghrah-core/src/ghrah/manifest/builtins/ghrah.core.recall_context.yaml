manifest: ability
version: "1"
metadata:
  namespace: ghrah.core
  name: recall_context
  title: Recall Context
  description: Recall original messages from the current-branch action-chain history, including nodes summarized away by compaction.
  tags: [core, context]
  permissions: {}
tool:
  name: recall_context
  description: Recall original context from the action-chain history of the current branch (fork ancestors included). Use after compaction to recover details that were summarized away — first list nodes (compact nodes carry summarized_range), then fetch messages by node_id or node_id_range.
  parameters:
    mode:
      type: string
      description: list summarizes nodes on the current branch; messages fetches original messages of the selected nodes
      required: false
      default: list
      enum: [list, messages]
    node_id:
      type: string
      description: Target a single node on the current branch (exclusive with node_id_range)
      required: false
    node_id_range:
      type: array
      description: Inclusive [from_id, to_id] range of node ids on the current branch
      required: false
      items:
        type: string
        description: Node id
        required: false
    keyword:
      type: string
      description: Case-insensitive substring filter over message text
      required: false
    role:
      type: string
      description: Filter messages by role
      required: false
      enum: [system, user, ai, tool]
    since_iteration:
      type: integer
      description: Only nodes with iteration >= this value
      required: false
      minimum: 0
    limit:
      type: integer
      description: Max number of nodes returned (most recent first)
      required: false
      default: 20
      minimum: 1
      maximum: 500
    max_output_tokens:
      type: integer
      description: Output budget; recall stops and sets truncated=True when exceeded
      required: false
      default: 2000
      minimum: 100
implementation:
  type: builtin
  handler: recall_context
